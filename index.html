<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PolyTrack Lite</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#4caf50;
}

canvas{
    display:block;
}

#hud{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-family:Arial;
    font-size:24px;
    text-shadow:2px 2px 4px black;
}
</style>
</head>
<body>

<div id="hud">
Speed: <span id="speed">0</span>
</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const keys = {};

document.addEventListener("keydown", e=>{
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e=>{
    keys[e.key.toLowerCase()] = false;
});

const car = {
    x: 400,
    y: 300,
    angle: 0,
    speed: 0
};

function update(){

    if(keys["w"])
        car.speed += 0.2;

    if(keys["s"])
        car.speed -= 0.15;

    if(keys["a"])
        car.angle -= 0.05;

    if(keys["d"])
        car.angle += 0.05;

    car.speed *= 0.98;

    car.x += Math.cos(car.angle) * car.speed;
    car.y += Math.sin(car.angle) * car.speed;

    document.getElementById("speed").textContent =
        Math.abs(car.speed * 12).toFixed(0);
}

function drawTrack(){

    ctx.fillStyle = "#2e7d32";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#555";

    ctx.fillRect(100,100,900,120);

    ctx.fillRect(880,100,120,500);

    ctx.fillRect(300,480,700,120);

    ctx.fillRect(300,220,120,380);

    ctx.fillRect(300,220,500,120);

    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 4;

    for(let i=0;i<20;i++){
        ctx.beginPath();
        ctx.moveTo(160+i*40,160);
        ctx.lineTo(180+i*40,160);
        ctx.stroke();
    }

    ctx.fillStyle = "white";

    for(let i=0;i<10;i++){
        ctx.fillRect(140,i*12+120,15,8);
    }
}

function drawCar(){

    ctx.save();

    ctx.translate(car.x,car.y);
    ctx.rotate(car.angle);

    ctx.fillStyle = "#e53935";
    ctx.fillRect(-20,-10,40,20);

    ctx.fillStyle = "#111";
    ctx.fillRect(-18,-14,10,6);
    ctx.fillRect(8,-14,10,6);
    ctx.fillRect(-18,8,10,6);
    ctx.fillRect(8,8,10,6);

    ctx.fillStyle = "#90caf9";
    ctx.fillRect(-10,-8,20,10);

    ctx.restore();
}

function draw(){

    drawTrack();
    drawCar();
}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

loop();

</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PolyTrack Lite</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#66aa66;
}

#hud{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-family:Arial;
    font-size:24px;
    z-index:100;
}

#win{
    display:none;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:yellow;
    font-size:50px;
    font-family:Arial;
}
</style>

</head>
<body>

<div id="hud">
    Speed: <span id="speed">0</span><br>
    Time: <span id="time">0.00</span><br>
    Checkpoints: <span id="cp">0</span>/2
</div>

<div id="win">YOU WIN!</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const keys={};

document.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()] = false;
});

const car={
    x:150,
    y:350,
    angle:0,
    speed:0
};

const checkpoints=[
{
    x:600,
    y:150,
    w:80,
    h:80,
    hit:false
},
{
    x:1000,
    y:500,
    w:80,
    h:80,
    hit:false
}
];

const finish={
    x:150,
    y:350,
    w:100,
    h:100
};

const startTime=Date.now();

function rectangleHit(rect){
    return (
        car.x > rect.x &&
        car.x < rect.x+rect.w &&
        car.y > rect.y &&
        car.y < rect.y+rect.h
    );
}

function update(){

    if(keys["w"])
        car.speed += 0.15;

    if(keys["s"])
        car.speed -= 0.10;

    if(keys["a"])
        car.angle -= 0.05;

    if(keys["d"])
        car.angle += 0.05;

    car.speed *= 0.98;

    car.x += Math.cos(car.angle)*car.speed;
    car.y += Math.sin(car.angle)*car.speed;

    checkpoints.forEach(cp=>{
        if(!cp.hit && rectangleHit(cp)){
            cp.hit=true;
        }
    });

    const completed =
    checkpoints.filter(c=>c.hit).length;

    if(
        completed===checkpoints.length &&
        rectangleHit(finish)
    ){
        document.getElementById("win").style.display="block";
    }

    document.getElementById("speed").textContent=
    Math.abs(car.speed*10).toFixed(0);

    document.getElementById("cp").textContent=
    completed;

    document.getElementById("time").textContent=
    ((Date.now()-startTime)/1000).toFixed(2);
}

function draw(){

    ctx.clearRect(0,0,
    canvas.width,
    canvas.height);

    ctx.fillStyle="#555";

    ctx.fillRect(100,100,1100,500);

    checkpoints.forEach(cp=>{
        ctx.fillStyle=
        cp.hit ? "lime" : "yellow";

        ctx.fillRect(
            cp.x,
            cp.y,
            cp.w,
            cp.h
        );
    });

    ctx.fillStyle="blue";

    ctx.fillRect(
        finish.x,
        finish.y,
        finish.w,
        finish.h
    );

    ctx.save();

    ctx.translate(
        car.x,
        car.y
    );

    ctx.rotate(car.angle);

    ctx.fillStyle="red";

    ctx.fillRect(
        -20,
        -10,
        40,
        20
    );

    ctx.restore();
}

function gameLoop(){
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();

</script>
</body>
</html>

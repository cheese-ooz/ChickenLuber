<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PolyTrack Lite</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: #2d2d2d;
}

canvas {
    display: block;
}

#hud {
    position: absolute;
    top: 10px;
    left: 10px;
    color: white;
    font-family: Arial;
    font-size: 24px;
}
</style>
</head>
<body tabindex="0">

<div id="hud">
Speed: <span id="speed">0</span>
</div>

<canvas id="game"></canvas>

<script>

document.body.focus();

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const speedText = document.getElementById("speed");

let keys = {};

window.addEventListener("keydown", (e) => {
    keys[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup", (e) => {
    keys[e.key.toLowerCase()] = false;
});

const car = {
    x: 250,
    y: 250,
    angle: 0,
    speed: 0
};

function update() {

    if(keys["w"] || keys["arrowup"]) {
        car.speed += 0.15;
    }

    if(keys["s"] || keys["arrowdown"]) {
        car.speed -= 0.1;
    }

    if(keys["a"] || keys["arrowleft"]) {
        car.angle -= 0.05;
    }

    if(keys["d"] || keys["arrowright"]) {
        car.angle += 0.05;
    }

    car.speed *= 0.98;

    car.x += Math.cos(car.angle) * car.speed;
    car.y += Math.sin(car.angle) * car.speed;

    speedText.textContent =
        Math.round(Math.abs(car.speed * 30));
}

function drawTrack() {

    ctx.fillStyle = "#3ea34d";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#5f5f5f";

    ctx.fillRect(100,100,1000,120);
    ctx.fillRect(980,100,120,600);
    ctx.fillRect(250,580,850,120);
    ctx.fillRect(250,220,120,480);

    ctx.fillStyle = "white";

    for(let i=0;i<10;i++) {
        ctx.fillRect(
            120,
            120 + i*10,
            20,
            6
        );
    }
}

function drawCar() {

    ctx.save();

    ctx.translate(car.x, car.y);
    ctx.rotate(car.angle);

    // Shadow
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fillRect(-32,-17,64,34);

    // Body
    ctx.fillStyle = "#ff2b2b";
    ctx.fillRect(-30,-15,60,30);

    // Windshield
    ctx.fillStyle = "#7ed6ff";
    ctx.fillRect(-15,-10,30,15);

    // Wheels
    ctx.fillStyle = "#111";

    ctx.fillRect(-25,-18,12,6);
    ctx.fillRect(13,-18,12,6);

    ctx.fillRect(-25,12,12,6);
    ctx.fillRect(13,12,12,6);

    ctx.restore();
}

function render() {

    update();

    drawTrack();

    drawCar();

    requestAnimationFrame(render);
}

render();

</script>

</body>
</html>

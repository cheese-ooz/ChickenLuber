<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PolyTrack Lite</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: #3fa34d;
}

canvas {
    display: block;
}

#hud {
    position: absolute;
    top: 10px;
    left: 10px;
    color: white;
    font-size: 24px;
    font-family: Arial, sans-serif;
    text-shadow: 2px 2px 4px black;
}
</style>
</head>
<body>

<div id="hud">Speed: <span id="speed">0</span></div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const speedDisplay = document.getElementById("speed");

const keys = {};

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

const car = {
    x: 250,
    y: 250,
    angle: 0,
    speed: 0
};

function update() {

    if (keys["w"]) car.speed += 0.15;
    if (keys["s"]) car.speed -= 0.10;

    if (keys["a"]) car.angle -= 0.05;
    if (keys["d"]) car.angle += 0.05;

    car.speed *= 0.98;

    car.x += Math.cos(car.angle) * car.speed;
    car.y += Math.sin(car.angle) * car.speed;

    speedDisplay.textContent =
        Math.abs(car.speed * 25).toFixed(0);
}

function drawTrack() {

    // Grass
    ctx.fillStyle = "#3fa34d";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Main road
    ctx.fillStyle = "#555";

    ctx.fillRect(100,100,800,120);
    ctx.fillRect(780,100,120,500);
    ctx.fillRect(250,480,650,120);
    ctx.fillRect(250,220,120,380);

    // Start line
    ctx.fillStyle = "white";

    for(let i=0;i<8;i++) {
        ctx.fillRect(
            120,
            110 + i * 12,
            20,
            8
        );
    }
}

function drawCar() {

    ctx.save();

    ctx.translate(car.x, car.y);
    ctx.rotate(car.angle);

    // Car body
    ctx.fillStyle = "#e53935";
    ctx.fillRect(-20, -10, 40, 20);

    // Windshield
    ctx.fillStyle = "#90caf9";
    ctx.fillRect(-8, -7, 16, 8);

    // Wheels
    ctx.fillStyle = "black";

    ctx.fillRect(-18,-13,8,5);
    ctx.fillRect(10,-13,8,5);

    ctx.fillRect(-18,8,8,5);
    ctx.fillRect(10,8,8,5);

    ctx.restore();
}

function draw() {

    drawTrack();
    drawCar();
}

function gameLoop() {

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

gameLoop();

</script>

</body>
</html>
